# Datasource is supplied by Testcontainers via @ServiceConnection; the schema comes from the real Flyway migrations (validated, never generated or dropped).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=test-only-secret-key-minimum-256-bits-long-for-hs256-signing
logging.level.org.hibernate.SQL=WARN
