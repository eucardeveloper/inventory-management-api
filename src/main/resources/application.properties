spring.application.name=inventory-management

# Profiles: nothing is active by default, on purpose. A deployment that forgets SPRING_PROFILES_ACTIVE
# must fail to start (no JWT_SECRET, no DB password) instead of silently running with development
# secrets, demo accounts and non-Secure cookies. Developers opt in with the "local" profile
# (application-local.properties); docker compose sets "docker". Any real environment must provide
# JWT_SECRET and SPRING_DATASOURCE_PASSWORD itself: there are no secret defaults in this file.
server.port=${PORT:8083}

# ─── Time zone ───────────────────────────────────────────────────────────────
# Everything is UTC: the JVM default zone is pinned in InventoryManagementApplication.main, timestamps
# are stored as UTC wall-clock time and the JSON API sends ISO-8601 that clients must read as UTC.
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ─── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/inventory_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# Never wait forever for a row lock (stock movements use SELECT ... FOR UPDATE).
spring.datasource.hikari.connection-init-sql=SET lock_timeout = 10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# NONE on purpose: any other strategy installs a filter that rewrites getRemoteAddr() from the client-supplied
# X-Forwarded-For header, which lets a caller dodge the login rate limit and forge the address in the audit log.
# ClientIpResolver is the single place that decides which address counts (see app.trust-forwarded-for below).
server.forward-headers-strategy=none

# ─── Flyway ──────────────────────────────────────────────────────────────────
# db/migration = schema only. Demo data lives in db/demo and is added by the local/docker profiles.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ─── API documentation ───────────────────────────────────────────────────────
# OpenAPI JSON and Swagger UI are NOT served unless explicitly enabled (the local profile does, the
# compose file does via APP_DOCS_ENABLED). Even when enabled, SecurityConfig requires an ADMIN session.
springdoc.api-docs.enabled=${APP_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${APP_DOCS_ENABLED:false}

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Signing key: required (>= 32 bytes) via JWT_SECRET. No default here; the application refuses to
# start without it (see JwtService). Only the local profile supplies a development key.
jwt.secret=${JWT_SECRET:}

# ─── Cookies / CSRF / CORS ───────────────────────────────────────────────────
# Secure + SameSite=Strict by default. Only the local profile (plain HTTP) turns Secure off.
app.cookie.secure=${APP_COOKIE_SECURE:true}
app.cookie.same-site=${APP_COOKIE_SAMESITE:Strict}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002}
app.login-rate-limit.max-attempts=10
app.login-rate-limit.window-seconds=60
# Upper bound for the number of client addresses the limiter remembers (oldest are evicted first).
app.login-rate-limit.max-clients=10000
# Read X-Forwarded-For (its LAST entry) only when exactly one trusted reverse proxy sits in front of the API.
# Off by default: the header is client-controlled and would let any caller forge the audit-log address.
app.trust-forwarded-for=${APP_TRUST_FORWARDED_FOR:false}

# ─── Virtual Threads (Java 21) ────────────────────────────────────────────────
# Replaces the Tomcat thread pool with lightweight JVM virtual threads.
# Each incoming request gets its own virtual thread at near-zero cost,
# eliminating the need for reactive programming for I/O-bound workloads.
spring.threads.virtual.enabled=true

# ─── Actuator + Prometheus Metrics ───────────────────────────────────────────
# Actuator listens on its own port that is NOT published to the host/internet (see docker-compose.yml);
# Prometheus scrapes it over the internal network. /actuator/metrics requires ADMIN.
# Finish in-flight requests on SIGTERM (docker stop) instead of cutting them off.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
# Publish latency histogram buckets so the Grafana p99 panel (histogram_quantile) has data.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ─── Structured logging ───────────────────────────────────────────────────────
# logback-spring.xml (on classpath) switches to JSON format in non-local profiles.
# MDC keys injected by RequestTraceFilter: traceId, requestId, userId, method, uri

# Per account (on top of the per-address limit): attempts per username per window, counted before the password is checked.
app.login-rate-limit.account-max-attempts=10
app.login-rate-limit.account-window-seconds=900
