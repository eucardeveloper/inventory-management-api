spring.application.name=inventory-management
server.port=${PORT:8083}

# ─── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/inventory_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.forward-headers-strategy=framework

# ─── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Signing key — MUST be overridden in every deployed environment via JWT_SECRET.
# The default below exists only so a local `mvn spring-boot:run` works out of the box.
jwt.secret=${JWT_SECRET:inventory-local-dev-only-secret-key-min-256-bits-change-me}

# ─── Virtual Threads (Java 21) ────────────────────────────────────────────────
# Replaces the Tomcat thread pool with lightweight JVM virtual threads.
# Each incoming request gets its own virtual thread at near-zero cost,
# eliminating the need for reactive programming for I/O-bound workloads.
spring.threads.virtual.enabled=true

# ─── Actuator + Prometheus Metrics ───────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# ─── Structured logging ───────────────────────────────────────────────────────
# logback-spring.xml (on classpath) switches to JSON format in non-local profiles.
# MDC keys injected by RequestTraceFilter: traceId, requestId, userId, method, uri
