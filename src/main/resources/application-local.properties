# Development profile. Active by default (spring.profiles.default=local) when no profile is set.
# These values are for localhost only and must never be used in a deployed environment.

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}
jwt.secret=${JWT_SECRET:inventory-local-dev-only-secret-key-min-256-bits-change-me}

# Plain HTTP on localhost: browsers would drop Secure cookies in some setups (e.g. Safari).
app.cookie.secure=false

# Schema migrations plus the demo data (users, products, lots, movements).
spring.flyway.locations=classpath:db/migration,classpath:db/demo
