# OWASP Dependency Check — runs weekly, not on every push
name: OWASP Weekly Scan

on:
  schedule:
    - cron: "0 8 * * 1"   # Every Monday 08:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub UI

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: "temurin"

jobs:
  owasp-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Get week number for cache key
        id: date
        run: echo "week=$(date +%Y-W%V)" >> $GITHUB_OUTPUT

      - name: Cache NVD database
        uses: actions/cache@v6
        with:
          path: ~/.dependency-check/data
          key: nvd-cache-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: nvd-cache-${{ runner.os }}-

      - name: Run OWASP dependency check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./mvnw -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=.github/owasp-suppressions.xml \
            -DnvdApiKey=${NVD_API_KEY:-""} \
            -DdataDirectory=${HOME}/.dependency-check/data \
            -DretireJsAnalyzerEnabled=false \
            -DnodeAnalyzerEnabled=false \
            --no-transfer-progress

      - name: Summarise findings
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p = "target/dependency-check-report.json"
          if not os.path.exists(p):
              print("::warning title=OWASP::no JSON report was produced (the scan itself failed)")
              raise SystemExit(0)
          rows = []
          for d in json.load(open(p)).get("dependencies", []):
              for v in d.get("vulnerabilities", []) or []:
                  score = 0.0
                  for k in ("cvssv3", "cvssv2", "cvssv4"):
                      if v.get(k):
                          score = max(score, float(v[k].get("baseScore", 0)))
                  rows.append((score, v.get("name", "?"), d.get("fileName", "?")))
          rows.sort(reverse=True)
          high = [r for r in rows if r[0] >= 7]
          lines = ["total findings: %d, CVSS >= 7: %d" % (len(rows), len(high))] + ["%.1f %s in %s" % r for r in high[:25]]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          print("::notice title=OWASP::" + "%0A".join(lines))
          PY
      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.html
          retention-days: 14
