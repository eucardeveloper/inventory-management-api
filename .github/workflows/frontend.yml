name: Frontend

on:
  push:
    branches: ["**"]
    paths: ["frontend/inventory-app/**", ".github/workflows/frontend.yml"]
  pull_request:
    branches: [main]
    paths: ["frontend/inventory-app/**", ".github/workflows/frontend.yml"]

jobs:
  frontend:
    name: Lint, test, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/inventory-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/inventory-app/package-lock.json
      - run: npm ci
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Unit tests
        run: npm test --if-present
      - run: npm run build
