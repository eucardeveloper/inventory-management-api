name: Frontend

on:
  push:
    branches: ["**"]
    paths: ["frontend/warehouse-app/**", ".github/workflows/frontend.yml"]
  pull_request:
    branches: [main]
    paths: ["frontend/warehouse-app/**", ".github/workflows/frontend.yml"]

jobs:
  frontend:
    name: Lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/warehouse-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/warehouse-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Unit tests
        run: npm test --if-present
      - run: npm run build
