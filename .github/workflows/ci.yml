name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Runs the FIFO unit tests and the Testcontainers concurrency tests.
      # The previous workflow used `-DskipTests`, so the suite never executed and a green
      # badge meant only that the code compiled. Testcontainers provides PostgreSQL itself,
      # so no `services:` block is needed — the test spins up the same postgres:16-alpine
      # image the application deploys against.
      - name: Build and run tests
        run: ./mvnw --batch-mode verify

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/warehouse-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/warehouse-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t inventory-api:${{ github.sha }} .
      - name: Build frontend image
        run: docker build -t inventory-app:${{ github.sha }} ./frontend/warehouse-app
